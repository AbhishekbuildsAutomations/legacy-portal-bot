{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<h1>Partner Log In</h1>
{% if expired %}<p class="error" role="alert" data-testid="session-expired">Your session has expired. Please log in again.</p>{% endif %}
{% if error %}<p class="error" role="alert" data-testid="login-error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <table>
    <tr><td><label for="username">Username</label></td><td><input id="username" name="username" autocomplete="username"></td></tr>
    <tr><td><label for="password">Password</label></td><td><input id="password" name="password" type="password" autocomplete="current-password"></td></tr>
  </table>
  <p><input type="submit" id="login-button" value="Log In"></p>
</form>
{% endblock %}
